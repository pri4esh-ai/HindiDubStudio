name: Replace HindiDubStudio MainActivity

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace-mainactivity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Replace MainActivity.kt
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/hindidubstudio

          printf '%s\n' \
          'package com.hindidubstudio' \
          '' \
          'import android.app.Activity' \
          'import android.content.Intent' \
          'import android.net.Uri' \
          'import android.os.Bundle' \
          'import android.view.Gravity' \
          'import android.view.View' \
          'import android.widget.Button' \
          'import android.widget.LinearLayout' \
          'import android.widget.ScrollView' \
          'import android.widget.TextView' \
          '' \
          'class MainActivity : Activity() {' \
          '' \
          '    private lateinit var statusText: TextView' \
          '    private var selectedMediaUri: Uri? = null' \
          '' \
          '    private val mediaPickerCode = 1001' \
          '' \
          '    override fun onCreate(savedInstanceState: Bundle?) {' \
          '        super.onCreate(savedInstanceState)' \
          '        buildMainScreen()' \
          '    }' \
          '' \
          '    private fun buildMainScreen() {' \
          '        val scrollView = ScrollView(this)' \
          '' \
          '        val root = LinearLayout(this).apply {' \
          '            orientation = LinearLayout.VERTICAL' \
          '            setPadding(32, 32, 32, 32)' \
          '        }' \
          '' \
          '        val title = TextView(this).apply {' \
          '            text = "HindiDubStudio"' \
          '            textSize = 28f' \
          '            gravity = Gravity.CENTER' \
          '            setPadding(0, 0, 0, 24)' \
          '        }' \
          '' \
          '        val subtitle = TextView(this).apply {' \
          '            text = "Offline English → Hindi Dubbing Studio"' \
          '            textSize = 16f' \
          '            gravity = Gravity.CENTER' \
          '            setPadding(0, 0, 0, 32)' \
          '        }' \
          '' \
          '        val selectMediaButton = Button(this).apply {' \
          '            text = "Select MP3 / WAV / MP4"' \
          '            setOnClickListener {' \
          '                openMediaPicker()' \
          '            }' \
          '        }' \
          '' \
          '        statusText = TextView(this).apply {' \
          '            text = "No media selected"' \
          '            textSize = 15f' \
          '            setPadding(0, 20, 0, 20)' \
          '        }' \
          '' \
          '        val speakerButton = Button(this).apply {' \
          '            text = "Speaker Detection"' \
          '            isEnabled = false' \
          '        }' \
          '' \
          '        val translationButton = Button(this).apply {' \
          '            text = "Translation Studio"' \
          '            isEnabled = false' \
          '        }' \
          '' \
          '        val voiceButton = Button(this).apply {' \
          '            text = "Voice Assignment"' \
          '            isEnabled = false' \
          '        }' \
          '' \
          '        val previewButton = Button(this).apply {' \
          '            text = "Preview Line"' \
          '            isEnabled = false' \
          '        }' \
          '' \
          '        val generateButton = Button(this).apply {' \
          '            text = "Generate Hindi Dub"' \
          '            isEnabled = false' \
          '        }' \
          '' \
          '        val exportButton = Button(this).apply {' \
          '            text = "Export MP3 / MP4"' \
          '            isEnabled = false' \
          '        }' \
          '' \
          '        root.addView(title, matchParams())' \
          '        root.addView(subtitle, matchParams())' \
          '        root.addView(selectMediaButton, matchParams())' \
          '        root.addView(statusText, matchParams())' \
          '        root.addView(speakerButton, matchParams())' \
          '        root.addView(translationButton, matchParams())' \
          '        root.addView(voiceButton, matchParams())' \
          '        root.addView(previewButton, matchParams())' \
          '        root.addView(generateButton, matchParams())' \
          '        root.addView(exportButton, matchParams())' \
          '' \
          '        scrollView.addView(root)' \
          '        setContentView(scrollView)' \
          '    }' \
          '' \
          '    private fun openMediaPicker() {' \
          '        val intent = Intent(Intent.ACTION_OPEN_DOCUMENT).apply {' \
          '            addCategory(Intent.CATEGORY_OPENABLE)' \
          '            type = "*/*"' \
          '        }' \
          '' \
          '        startActivityForResult(intent, mediaPickerCode)' \
          '    }' \
          '' \
          '    @Deprecated("Use Activity Result API in the final media module.")' \
          '    override fun onActivityResult(' \
          '        requestCode: Int,' \
          '        resultCode: Int,' \
          '        data: Intent?' \
          '    ) {' \
          '        super.onActivityResult(requestCode, resultCode, data)' \
          '' \
          '        if (requestCode == mediaPickerCode && resultCode == RESULT_OK) {' \
          '            selectedMediaUri = data?.data' \
          '' \
          '            statusText.text = if (selectedMediaUri != null) {' \
          '                "Media selected successfully"' \
          '            } else {' \
          '                "No media selected"' \
          '            }' \
          '        }' \
          '    }' \
          '' \
          '    private fun matchParams(): LinearLayout.LayoutParams {' \
          '        return LinearLayout.LayoutParams(' \
          '            LinearLayout.LayoutParams.MATCH_PARENT,' \
          '            LinearLayout.LayoutParams.WRAP_CONTENT' \
          '        ).apply {' \
          '            bottomMargin = 16' \
          '        }' \
          '    }' \
          '}' \
          > app/src/main/java/com/hindidubstudio/MainActivity.kt

          echo "MainActivity.kt completely replaced."

      - name: Verify MainActivity
        shell: bash
        run: |
          set -e

          echo "===== MainActivity.kt ====="
          sed -n '1,260p' app/src/main/java/com/hindidubstudio/MainActivity.kt

          echo "===== Checking duplicate class declarations ====="
          COUNT=$(grep -c "class MainActivity" app/src/main/java/com/hindidubstudio/MainActivity.kt || true)

          if [ "$COUNT" -ne 1 ]; then
            echo "Expected exactly one MainActivity class."
            exit 1
          fi

          echo "MainActivity verification passed."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Detect Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "SDKMANAGER=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" >> "$GITHUB_ENV"
          elif [ -x "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" ]; then
            echo "SDKMANAGER=$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" >> "$GITHUB_ENV"
          else
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"

            if [ -z "$SDKMANAGER" ]; then
              echo "sdkmanager was not found."
              exit 1
            fi

            echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          fi

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          "$SDKMANAGER" --version

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: |
          gradle assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e

          test -f app/build/outputs/apk/debug/app-debug.apk

          echo "APK successfully built:"
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Commit replacement
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add app/src/main/java/com/hindidubstudio/MainActivity.kt

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Replace MainActivity with lightweight dubbing UI"
            git push
          fi

          echo "MainActivity replacement completed successfully."
