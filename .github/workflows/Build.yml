name: Build HindiDubStudio Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Create HindiDubStudio project structure
        shell: bash
        run: |
          set -e

          echo "Creating project folders..."

          # Kotlin source folders
          mkdir -p app/src/main/java/com/hindidubstudio/ui
          mkdir -p app/src/main/java/com/hindidubstudio/audio
          mkdir -p app/src/main/java/com/hindidubstudio/dubbing
          mkdir -p app/src/main/java/com/hindidubstudio/models
          mkdir -p app/src/main/java/com/hindidubstudio/export
          mkdir -p app/src/main/java/com/hindidubstudio/utils

          # New voice / speaker architecture
          mkdir -p app/src/main/java/com/hindidubstudio/voice
          mkdir -p app/src/main/java/com/hindidubstudio/speakers
          mkdir -p app/src/main/java/com/hindidubstudio/translation
          mkdir -p app/src/main/java/com/hindidubstudio/preview
          mkdir -p app/src/main/java/com/hindidubstudio/media
          mkdir -p app/src/main/java/com/hindidubstudio/timeline

          # Native code
          mkdir -p app/src/main/cpp

          # AI model folders
          mkdir -p app/src/main/assets/models/asr
          mkdir -p app/src/main/assets/models/vad
          mkdir -p app/src/main/assets/models/translation
          mkdir -p app/src/main/assets/models/tts
          mkdir -p app/src/main/assets/models/voice
          mkdir -p app/src/main/assets/models/speaker

          # Voice assets
          mkdir -p app/src/main/assets/voices/reference
          mkdir -p app/src/main/assets/voices/generated
          mkdir -p app/src/main/assets/voices/presets

          # Audio assets
          mkdir -p app/src/main/assets/sfx
          mkdir -p app/src/main/assets/ambience
          mkdir -p app/src/main/assets/music

          # Resources
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/values

          # Keep empty folders in Git
          touch app/src/main/assets/models/asr/.gitkeep
          touch app/src/main/assets/models/vad/.gitkeep
          touch app/src/main/assets/models/translation/.gitkeep
          touch app/src/main/assets/models/tts/.gitkeep
          touch app/src/main/assets/models/voice/.gitkeep
          touch app/src/main/assets/models/speaker/.gitkeep

          touch app/src/main/assets/voices/reference/.gitkeep
          touch app/src/main/assets/voices/generated/.gitkeep
          touch app/src/main/assets/voices/presets/.gitkeep

          touch app/src/main/assets/sfx/.gitkeep
          touch app/src/main/assets/ambience/.gitkeep
          touch app/src/main/assets/music/.gitkeep

          touch app/src/main/java/com/hindidubstudio/ui/.gitkeep
          touch app/src/main/java/com/hindidubstudio/audio/.gitkeep
          touch app/src/main/java/com/hindidubstudio/dubbing/.gitkeep
          touch app/src/main/java/com/hindidubstudio/models/.gitkeep
          touch app/src/main/java/com/hindidubstudio/export/.gitkeep
          touch app/src/main/java/com/hindidubstudio/utils/.gitkeep
          touch app/src/main/java/com/hindidubstudio/voice/.gitkeep
          touch app/src/main/java/com/hindidubstudio/speakers/.gitkeep
          touch app/src/main/java/com/hindidubstudio/translation/.gitkeep
          touch app/src/main/java/com/hindidubstudio/preview/.gitkeep
          touch app/src/main/java/com/hindidubstudio/media/.gitkeep
          touch app/src/main/java/com/hindidubstudio/timeline/.gitkeep

          echo "Project structure created."

      - name: Detect Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "SDKMANAGER=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" >> "$GITHUB_ENV"

          elif [ -x "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" ]; then
            echo "SDKMANAGER=$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" >> "$GITHUB_ENV"

          else
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"

            if [ -z "$SDKMANAGER" ]; then
              echo "sdkmanager was not found."
              exit 1
            fi

            echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          fi

      - name: Install Android SDK packages
        shell: bash
        run: |
          "$SDKMANAGER" --version

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check Gradle
        run: |
          gradle --version

      - name: Build Debug APK
        run: |
          gradle assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Commit generated folder structure
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add app/src/main/java
          git add app/src/main/assets
          git add app/src/main/cpp
          git add app/src/main/res

          if git diff --cached --quiet; then
            echo "No new folders/files to commit."
          else
            git commit -m "Add Hindi dubbing voice and speaker project structure"
            git push
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: HindiDubStudio-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
