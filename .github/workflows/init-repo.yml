name: Initialize HindiDubStudio Repository

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  initialize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create complete repository structure
        shell: bash
        run: |
          set -e

          echo "Initializing HindiDubStudio..."

          # --------------------------------------------------
          # Kotlin source directories
          # --------------------------------------------------

          mkdir -p app/src/main/java/com/hindidubstudio/ui
          mkdir -p app/src/main/java/com/hindidubstudio/audio
          mkdir -p app/src/main/java/com/hindidubstudio/dubbing
          mkdir -p app/src/main/java/com/hindidubstudio/models
          mkdir -p app/src/main/java/com/hindidubstudio/export
          mkdir -p app/src/main/java/com/hindidubstudio/utils

          # Speaker system
          mkdir -p app/src/main/java/com/hindidubstudio/speakers
          mkdir -p app/src/main/java/com/hindidubstudio/timeline

          # Translation system
          mkdir -p app/src/main/java/com/hindidubstudio/translation

          # Voice cloning / voice selection
          mkdir -p app/src/main/java/com/hindidubstudio/voice

          # Preview system
          mkdir -p app/src/main/java/com/hindidubstudio/preview

          # Media processing
          mkdir -p app/src/main/java/com/hindidubstudio/media

          # --------------------------------------------------
          # Native C++
          # --------------------------------------------------

          mkdir -p app/src/main/cpp

          # --------------------------------------------------
          # AI model directories
          # --------------------------------------------------

          mkdir -p app/src/main/assets/models/asr
          mkdir -p app/src/main/assets/models/vad
          mkdir -p app/src/main/assets/models/translation
          mkdir -p app/src/main/assets/models/tts
          mkdir -p app/src/main/assets/models/voice
          mkdir -p app/src/main/assets/models/speaker

          # --------------------------------------------------
          # Voice sample directories
          # --------------------------------------------------

          mkdir -p app/src/main/assets/voices/reference
          mkdir -p app/src/main/assets/voices/generated
          mkdir -p app/src/main/assets/voices/presets

          # --------------------------------------------------
          # Audio directories
          # --------------------------------------------------

          mkdir -p app/src/main/assets/sfx
          mkdir -p app/src/main/assets/ambience
          mkdir -p app/src/main/assets/music

          # --------------------------------------------------
          # Android resources
          # --------------------------------------------------

          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/values

          # --------------------------------------------------
          # Keep directories in Git
          # --------------------------------------------------

          find app/src/main -type d -empty -exec touch {}/.gitkeep \;

          # --------------------------------------------------
          # Root Gradle files
          # --------------------------------------------------

          printf '%s\n' \
          'plugins {' \
          '    id("com.android.application") version "8.7.3" apply false' \
          '    id("org.jetbrains.kotlin.android") version "2.0.21" apply false' \
          '}' \
          > build.gradle.kts

          printf '%s\n' \
          'pluginManagement {' \
          '    repositories {' \
          '        google()' \
          '        mavenCentral()' \
          '        gradlePluginPortal()' \
          '    }' \
          '}' \
          '' \
          'dependencyResolutionManagement {' \
          '    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)' \
          '    repositories {' \
          '        google()' \
          '        mavenCentral()' \
          '    }' \
          '}' \
          '' \
          'rootProject.name = "HindiDubStudio"' \
          '' \
          'include(":app")' \
          > settings.gradle.kts

          # --------------------------------------------------
          # Gradle properties
          # --------------------------------------------------

          printf '%s\n' \
          'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' \
          'android.useAndroidX=true' \
          'kotlin.code.style=official' \
          > gradle.properties

          # --------------------------------------------------
          # App Gradle file
          # --------------------------------------------------

          printf '%s\n' \
          'plugins {' \
          '    id("com.android.application")' \
          '    id("org.jetbrains.kotlin.android")' \
          '}' \
          '' \
          'android {' \
          '    namespace = "com.hindidubstudio"' \
          '    compileSdk = 35' \
          '' \
          '    defaultConfig {' \
          '        applicationId = "com.hindidubstudio"' \
          '        minSdk = 26' \
          '        targetSdk = 35' \
          '        versionCode = 1' \
          '        versionName = "0.1.0"' \
          '    }' \
          '' \
          '    buildFeatures {' \
          '        viewBinding = true' \
          '    }' \
          '' \
          '    compileOptions {' \
          '        sourceCompatibility = JavaVersion.VERSION_17' \
          '        targetCompatibility = JavaVersion.VERSION_17' \
          '    }' \
          '' \
          '    kotlinOptions {' \
          '        jvmTarget = "17"' \
          '    }' \
          '}' \
          '' \
          'dependencies {' \
          '}' \
          > app/build.gradle.kts

          # --------------------------------------------------
          # Android Manifest
          # --------------------------------------------------

          printf '%s\n' \
          '<manifest xmlns:android="http://schemas.android.com/apk/res/android">' \
          '' \
          '    <application' \
          '        android:allowBackup="true"' \
          '        android:label="HindiDubStudio"' \
          '        android:supportsRtl="true"' \
          '        android:theme="@android:style/Theme.Material.Light.NoActionBar">' \
          '' \
          '        <activity' \
          '            android:name=".MainActivity"' \
          '            android:exported="true">' \
          '            <intent-filter>' \
          '                <action android:name="android.intent.action.MAIN"/>' \
          '                <category android:name="android.intent.category.LAUNCHER"/>' \
          '            </intent-filter>' \
          '        </activity>' \
          '' \
          '    </application>' \
          '' \
          '</manifest>' \
          > app/src/main/AndroidManifest.xml

          # --------------------------------------------------
          # MainActivity
          # --------------------------------------------------

          printf '%s\n' \
          'package com.hindidubstudio' \
          '' \
          'import android.app.Activity' \
          'import android.os.Bundle' \
          '' \
          'class MainActivity : Activity() {' \
          '    override fun onCreate(savedInstanceState: Bundle?) {' \
          '        super.onCreate(savedInstanceState)' \
          '    }' \
          '}' \
          > app/src/main/java/com/hindidubstudio/MainActivity.kt

          # --------------------------------------------------
          # Native CMake
          # --------------------------------------------------

          printf '%s\n' \
          'cmake_minimum_required(VERSION 3.22)' \
          'project(HindiDubStudio)' \
          > app/src/main/cpp/CMakeLists.txt

          # --------------------------------------------------
          # Native engine placeholder
          # --------------------------------------------------

          printf '%s\n' \
          '// HindiDubStudio native dubbing engine' \
          > app/src/main/cpp/native_dubbing.cpp

          # --------------------------------------------------
          # Strings
          # --------------------------------------------------

          printf '%s\n' \
          '<resources>' \
          '    <string name="app_name">HindiDubStudio</string>' \
          '</resources>' \
          > app/src/main/res/values/strings.xml

          # --------------------------------------------------
          # README
          # --------------------------------------------------

          printf '%s\n' \
          '# HindiDubStudio' \
          '' \
          'Offline English to Hindi dubbing studio for Android.' \
          '' \
          'Features planned:' \
          '- MP3, WAV and MP4 input' \
          '- Speaker detection' \
          '- Editable Hindi translation' \
          '- Smart Replace' \
          '- Per-speaker voice assignment' \
          '- Original voice preservation' \
          '- Reference voice sample cloning' \
          '- Hindi TTS' \
          '- Per-line preview' \
          '- Background music preservation' \
          '- MP3 and MP4 export' \
          '- Offline/on-device processing' \
          > README.md

          echo "HindiDubStudio initialization complete."

      - name: Commit repository structure
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "Initialize HindiDubStudio project structure"
            git push
          fi

          echo "Repository initialized successfully."
